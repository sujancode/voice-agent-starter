# Every push deploys to test. Give it a test key (va_test_…): it can never change production.
# Production gets a deployment that passed test: `polka promote <version>` with a live key,
# or Promote in the dashboard.
name: Deploy the dot
on: push
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx polka deploy
        env:
          POLKA_KEY: ${{ secrets.POLKA_KEY }}
          POLKA_API: ${{ vars.POLKA_API }}
